<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Comparison Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .upload-container:hover {
            border-color: #007bff;
            background-color: #f8f9fa;
        }
        .file-input {
            display: none;
        }
        .flash-message {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">PDF Comparison Tool</h1>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show flash-message" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div id="input-form">
            <form id="compare-form" action="{{ url_for('index') }}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                First Text Input
                            </div>
                            <div class="card-body">
                                <textarea name="text1" id="text1" class="form-control" rows="12" placeholder="Paste or type the first text here..." required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-success text-white">
                                Second Text Input
                            </div>
                            <div class="card-body">
                                <textarea name="text2" id="text2" class="form-control" rows="12" placeholder="Paste or type the second text here..." required></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg" id="compare-btn">
                        <span id="button-text">Compare Texts</span>
                        <span id="button-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </div>
            </form>
        </div>
        <div id="compare-result" class="mt-5"></div>
        

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('compare-form');
        const resultDiv = document.getElementById('compare-result');
        const compareBtn = document.getElementById('compare-btn');
        const buttonText = document.getElementById('button-text');
        const buttonSpinner = document.getElementById('button-spinner');
        
        // Store current comparison data for saving
        let currentComparisonData = null;
        
        // Function to handle form submission
        async function handleSubmit(e) {
            e.preventDefault();
            
            // Show loading state
            compareBtn.disabled = true;
            buttonText.textContent = 'Comparing...';
            buttonSpinner.classList.remove('d-none');
            
            try {
                // Show loading message
                resultDiv.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div><p class="mt-2">Comparing texts...</p></div>';
                
                // Submit form data
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache',
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Parse JSON response
                const data = await response.json();
                
                // Update the result div with the HTML from the response
                if (data.status === 'success') {
                    resultDiv.innerHTML = data.html;
                    
                    // Store comparison data for potential saving
                    currentComparisonData = data.comparison_data;
                    
                    // Update saved comparisons count
                    updateSavedCount();
                    
                    // Scroll to results
                    resultDiv.scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error(data.message || 'Unknown error occurred');
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> ${error.message}
                    </div>`;
            } finally {
                // Restore button state
                compareBtn.disabled = false;
                buttonText.textContent = 'Compare Texts';
                buttonSpinner.classList.add('d-none');
            }
        }
        
        // Bind the event listener to the form
        form.onsubmit = handleSubmit;
        
        // Function to update saved comparisons count
        async function updateSavedCount() {
            try {
                const response = await fetch('/get_saved_comparisons');
                const data = await response.json();
                const count = data.total_comparisons;
                
                document.querySelectorAll('#saved-count, #total-saved').forEach(el => {
                    el.textContent = count;
                });
                
                // Show/hide PDF generation button
                const pdfBtn = document.getElementById('generate-pdf-btn');
                if (pdfBtn) {
                    pdfBtn.style.display = count > 0 ? 'inline-block' : 'none';
                }
                
            } catch (error) {
                console.error('Error updating saved count:', error);
            }
        }
        
        // Function to save current comparison
        async function saveComparison() {
            if (!currentComparisonData) {
                alert('No comparison data to save');
                return;
            }
            
            try {
                const response = await fetch('/save_comparison', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        comparison_data: currentComparisonData
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert(data.message);
                    updateSavedCount();
                    
                    // Disable save button to prevent duplicate saves
                    const saveBtn = document.getElementById('save-comparison-btn');
                    if (saveBtn) {
                        saveBtn.disabled = true;
                        saveBtn.textContent = 'Saved!';
                    }
                } else {
                    alert('Error: ' + data.message);
                }
                
            } catch (error) {
                console.error('Error saving comparison:', error);
                alert('Error saving comparison: ' + error.message);
            }
        }
        
        // Function to start next comparison
        function nextComparison() {
            resultDiv.innerHTML = '';
            form.reset();
            currentComparisonData = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Function to generate PDF
        async function generatePDF() {
            try {
                const pdfBtn = document.getElementById('generate-pdf-btn');
                if (pdfBtn) {
                    pdfBtn.disabled = true;
                    pdfBtn.textContent = 'Generating...';
                }
                
                const response = await fetch('/generate_pdf', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Trigger download
                    window.location.href = data.download_url;
                    alert('PDF generated successfully!');
                } else {
                    alert('Error generating PDF: ' + data.message);
                }
                
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF: ' + error.message);
            } finally {
                const pdfBtn = document.getElementById('generate-pdf-btn');
                if (pdfBtn) {
                    pdfBtn.disabled = false;
                    pdfBtn.textContent = 'Generate PDF';
                }
            }
        }
        
        // Function to clear all saved comparisons
        async function clearAllComparisons() {
            if (!confirm('Are you sure you want to clear all saved comparisons?')) {
                return;
            }
            
            try {
                const response = await fetch('/clear_comparisons', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert(data.message);
                    updateSavedCount();
                    
                    // Hide saved info
                    const savedInfo = document.getElementById('saved-comparisons-info');
                    if (savedInfo) {
                        savedInfo.style.display = 'none';
                    }
                } else {
                    alert('Error: ' + data.message);
                }
                
            } catch (error) {
                console.error('Error clearing comparisons:', error);
                alert('Error clearing comparisons: ' + error.message);
            }
        }
        
        // Function to toggle saved comparisons info
        function toggleSavedInfo() {
            const savedInfo = document.getElementById('saved-comparisons-info');
            if (savedInfo) {
                savedInfo.style.display = savedInfo.style.display === 'none' ? 'block' : 'none';
            }
        }
        
        // Event delegation for dynamically created buttons
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'save-comparison-btn') {
                e.preventDefault();
                saveComparison();
            } else if (e.target && e.target.id === 'next-comparison-btn') {
                e.preventDefault();
                nextComparison();
            } else if (e.target && e.target.id === 'generate-pdf-btn') {
                e.preventDefault();
                generatePDF();
            } else if (e.target && e.target.id === 'view-saved-btn') {
                e.preventDefault();
                toggleSavedInfo();
            } else if (e.target && e.target.id === 'clear-all-btn') {
                e.preventDefault();
                clearAllComparisons();
            } else if (e.target && e.target.matches('a[href="/"]')) {
                // Legacy new comparison button
                e.preventDefault();
                nextComparison();
            }
        });
        
        // Initialize saved count on page load
        updateSavedCount();
    });
    </script>
</body>
</html>
